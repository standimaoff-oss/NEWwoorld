name: ShopSim APK (Android)

# Собирает настоящий подписанный APK на раннере GitHub, где есть Android SDK.
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'game/**'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать и показать размер
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk"
          mkdir -p out
          cp "$apk" out/ShopSim.apk
          ls -lh out/ShopSim.apk
          echo "--- содержимое APK ---"
          unzip -l out/ShopSim.apk | tail -n +4 | head -14

      - name: Проверить подпись
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs out/ShopSim.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: ShopSim-APK
          path: out/ShopSim.apk
          if-no-files-found: error

      - name: Приложить APK к релизу
        if: startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="shopsim-latest"
          gh release create "$TAG" out/ShopSim.apk \
            --title "ShopSim — сборки для Android и Windows" \
            --notes "Готовые сборки ShopSim: ShopSim.apk (Android) и ShopSim.exe (Windows, x86-64). Подписано отладочным ключом CI — установка требует разрешить «неизвестные источники»." \
            || gh release upload "$TAG" out/ShopSim.apk --clobber

      - name: Положить APK в ветку (для проверки и прямых ссылок)
        if: startsWith(github.ref, 'refs/heads/arena/')
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/ShopSim.apk dist/ShopSim.apk
          git config user.name "ShopSim CI"
          git config user.email "ci@arena.ai"
          git add -f dist/ShopSim.apk
          git commit -m "ci: ShopSim.apk (Android) [skip ci]" || echo "APK не изменился"
          git push origin "HEAD:${{ github.ref_name }}" || echo "push пропущен"
