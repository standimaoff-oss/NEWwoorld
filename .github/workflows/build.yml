name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, package
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (compile + tests + reobf jar)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aquaflux-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
