name: China Preview apps (APK + EXE)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'apps = rebuild wrappers, osm = fetch OSM extract only'
        required: false
        default: 'apps'
        type: choice
        options:
          - apps
          - osm
  push:
    paths:
      - 'China_Preview.html'
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/china-preview-apps.yml'

jobs:
  osm:
    name: Fetch real OSM geometry
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'osm') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'osm-only'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch OSM API v0.6 map.json
        run: |
          set -euo pipefail
          mkdir -p docs/beijing-osm-3d
          bbox='116.385,39.930,116.402,39.945'
          url="https://api.openstreetmap.org/api/0.6/map.json?bbox=${bbox}"
          echo "Fetching $url"
          curl --fail --silent --show-error --location --compressed \
            --retry 4 --retry-delay 5 --retry-all-errors \
            -A 'BeijingOSM3D/1.0 (standalone OSM visualization; contact via repository)' \
            "$url" -o docs/beijing-osm-3d/osm-map.json
          python3 - <<'PY'
          import json, datetime, pathlib
          p = pathlib.Path('docs/beijing-osm-3d/osm-map.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          n = len(d.get('elements', []))
          if n < 100:
              raise SystemExit(f'OSM extract suspiciously small: {n} elements')
          meta = {
              'source': 'OpenStreetMap API v0.6 / map.json',
              'url': 'https://api.openstreetmap.org/api/0.6/map.json',
              'name': 'Beijing · Gulou / Nanluoguxiang hutongs',
              'bboxWGS84': [116.385, 39.930, 116.402, 39.945],
              'retrievedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'attribution': '© OpenStreetMap contributors',
              'license': 'ODbL 1.0',
              'licenseUrl': 'https://www.openstreetmap.org/copyright',
              'coordinateSystem': 'WGS84 / EPSG:4326',
              'elements': n,
              'bounds': d.get('bounds'),
              'generator': d.get('generator'),
          }
          pathlib.Path('docs/beijing-osm-3d/osm-source.json').write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Fetched {n} OSM elements, {p.stat().st_size:,} bytes')
          PY
      - name: Commit extract back to the same branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/beijing-osm-3d/osm-map.json docs/beijing-osm-3d/osm-source.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'data(osm): fetch Beijing Gulou / Nanluoguxiang extract [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
  apk:
    name: Android APK
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'osm') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, 'osm-only'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChinaPreview-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  exe:
    name: Windows portable EXE
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'osm') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, 'osm-only'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron toolchain
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package portable EXE
        working-directory: desktop
        run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ChinaPreview-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error

  publish:
    name: Put binaries back on the branch
    needs: [apk, exe]
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ChinaPreview-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ChinaPreview-EXE
          path: dist
      - name: Normalize binary names
        run: |
          ls -lh dist
          apk=$(find dist -name '*.apk' ! -name 'ChinaPreview.apk' | head -1)
          if [ -n "$apk" ]; then mv -f "$apk" dist/ChinaPreview.apk; fi
          exe=$(find dist -name '*.exe' ! -name 'ChinaPreview.exe' | head -1)
          if [ -n "$exe" ]; then mv -f "$exe" dist/ChinaPreview.exe; fi
          ls -lh dist
          test -f dist/ChinaPreview.apk
          test -f dist/ChinaPreview.exe
      - name: Commit binaries to the working branch
        run: |
          git config user.name "Arena CI"
          git config user.email "ci@arena.ai"
          git add -f dist/ChinaPreview.apk dist/ChinaPreview.exe
          git commit -m "ci: publish China Preview APK and portable EXE [skip ci]" || echo "binaries unchanged"
          git push origin HEAD:${{ github.ref_name }}
