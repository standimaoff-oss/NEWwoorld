name: In-game screenshots

# Настоящие скриншоты из игры: CI поднимает Xvfb с программным OpenGL,
# запускает клиент Minecraft с модом и снимает кадры из кадрового буфера.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'src/main/java/com/standimaoff/aquaflux/dev/**'
      - '.github/workflows/ingame.yml'

permissions:
  contents: write

concurrency:
  group: ingame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: "Клиент + Xvfb: кадры из игры"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: "Программный OpenGL и виртуальный экран"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglu1-mesa mesa-utils libxrandr2 libxinerama1 libxcursor1 libxi6

      # Мир нужен готовым: клиент стартует с --quickPlaySingleplayer harness.
      - name: Сгенерировать плоский мир сервером
        shell: bash
        run: |
          set +e
          mkdir -p run-server
          echo "eula=true" > run-server/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nmax-tick-time=-1\nspawn-protection=0\nlevel-name=world\n' > run-server/server.properties
          ( timeout 420 ./gradlew runServer --no-daemon --stacktrace > server.log 2>&1 ) &
          GRADLE_PID=$!
          for i in $(seq 1 150); do
            if grep -qE 'Done \([0-9.]+s\)!' server.log 2>/dev/null; then echo "сервер поднялся"; break; fi
            if ! kill -0 $GRADLE_PID 2>/dev/null; then echo "gradle runServer завершился"; break; fi
            sleep 2
          done
          sleep 5
          kill $GRADLE_PID 2>/dev/null
          pkill -f 'net.minecraftforge.server' 2>/dev/null
          pkill -f 'net.minecraft.server' 2>/dev/null
          sleep 3
          echo "---- хвост server.log ----"
          tail -30 server.log
          echo "---- мир ----"
          ls -la run-server/world 2>/dev/null || echo "Мира нет"

      - name: Снять кадры в игре
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          mkdir -p run/saves docs/preview/ingame ci-logs
          rm -rf run/saves/harness
          cp -r run-server/world run/saves/harness
          rm -f run/saves/harness/session.lock
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runClient --no-daemon --stacktrace \
            -Pshots="$PWD/docs/preview/ingame" > client.log 2>&1 &
          CLIENT_PID=$!
          for i in $(seq 1 180); do
            sleep 5
            if grep -q "\\[screens\\] выхожу из игры" client.log; then echo "клиент снял кадры и вышел"; break; fi
            if ! kill -0 $CLIENT_PID 2>/dev/null; then echo "клиент завершился (код $?)"; break; fi
          done
          kill $CLIENT_PID 2>/dev/null
          pkill -f 'net.minecraft.client.main' 2>/dev/null
          sleep 2
          {
            echo "=== client.log: начало ==="
            head -150 client.log
            echo
            echo "=== client.log: ошибки ==="
            grep -nE "Exception|Caused by|FAILED|error:|What went wrong|\[screens\]" client.log | head -120
            echo
            echo "=== client.log: хвост ==="
            tail -150 client.log
            echo
            echo "=== server.log: хвост ==="
            tail -60 server.log
            echo
            echo "=== мир ==="
            ls -la run-server/world 2>&1 | head -20
          } > ci-logs/ingame.log 2>&1
          ls -la docs/preview/ingame >> ci-logs/ingame.log 2>&1 || true
          test -f docs/preview/ingame/ingame-01-pit.png

      - name: Забрать кадры и логи
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingame-screenshots
          path: |
            docs/preview/ingame/*.png
            client.log
            server.log
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Закоммитить кадры
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "aquaflux-ci"
          git config user.email "ci@aquaflux.invalid"
          git add -f docs/preview/ingame ci-logs/ingame.log
          if git diff --cached --quiet; then
            echo "новых кадров нет"
            exit 0
          fi
          git commit -m "docs: кадры из игры ${GITHUB_SHA::7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
