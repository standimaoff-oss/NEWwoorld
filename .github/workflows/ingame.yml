name: In-game screenshots

# Настоящие скриншоты из игры: CI поднимает Xvfb с программным OpenGL,
# запускает клиент Minecraft с модом и снимает кадры из кадрового буфера.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: write

concurrency:
  group: ingame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: "Клиент + Xvfb: кадры из игры"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: "Программный OpenGL и виртуальный экран"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6

      # Клиент стартует сразу в мир (--quickPlaySingleplayer harness),
      # поэтому мир должен существовать до запуска клиента.
      - name: Мир для быстрого старта
        shell: bash
        run: |
          set +e
          mkdir -p run-server run/saves ci-logs
          echo "eula=true" > run-server/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nmax-tick-time=-1\nlevel-name=world\nspawn-protection=0\n' > run-server/server.properties
          ( timeout 900 ./gradlew runServer --no-daemon --stacktrace > server.log 2>&1 ) &
          GRADLE_PID=$!
          for i in $(seq 1 300); do
            sleep 2
            if grep -qE 'Done \([0-9.]+s\)!' server.log 2>/dev/null; then echo "сервер поднялся"; break; fi
            if ! kill -0 $GRADLE_PID 2>/dev/null; then echo "gradle runServer завершился"; break; fi
          done
          sleep 6
          kill $GRADLE_PID 2>/dev/null
          pkill -f 'net.minecraft.server' 2>/dev/null
          sleep 3
          tail -40 server.log > ci-logs/server-tail.log 2>&1
          if [ -f run-server/world/level.dat ]; then
            cp -r run-server/world run/saves/harness
            rm -f run/saves/harness/session.lock
            echo "мир скопирован в run/saves/harness"
          else
            echo "СЕРВЕР НЕ СОЗДАЛ МИР" >> ci-logs/server-tail.log
          fi
          ls -la run/saves/harness 2>&1 | head -10 >> ci-logs/server-tail.log

      - name: "Клиент: снять кадры"
        shell: bash
        run: |
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runClient --no-daemon --stacktrace \
            -Pshots="$PWD/docs/preview/ingame" -Pmagenta > client.log 2>&1
          echo "код клиента: $?"
          {
            echo "=== метки харнесса ==="
            grep -a "\[screens\]" client.log | head -80
            echo
            echo "=== ошибки ==="
            grep -nE -A 20 -B 2 "Exception|Caused by|FAILED|What went wrong" client.log | head -200
            echo
            echo "=== хвост ==="
            tail -80 client.log
          } > ci-logs/ingame.log 2>&1
          gzip -9 -c client.log > ci-logs/client.log.gz
          tail -100 ci-logs/ingame.log

      - name: "Список кадров"
        if: always()
        shell: bash
        run: |
          ls -la docs/preview/ingame 2>&1 | tail -20
          file docs/preview/ingame/*.png 2>/dev/null | head -20

      - name: Smoke-тест jar
        if: always()
        shell: bash
        run: |
          ls -la build/libs 2>&1 | tail -5 || true

      - name: Закоммитить кадры и логи
        if: always()
        shell: bash
        run: |
          git config user.name "aquaflux-ci"
          git config user.email "ci@aquaflux.invalid"
          {
            echo "=== метки харнесса ==="
            grep -a "\[screens\]" client.log 2>/dev/null | head -60 || echo "client.log нет"
            echo
            echo "=== хвост client.log ==="
            tail -60 client.log 2>/dev/null
          } > ci-logs/status.txt 2>&1
          git add -f docs/preview/ingame ci-logs/ingame.log ci-logs/client.log.gz ci-logs/server-tail.log ci-logs/status.txt
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "docs: кадры из игры ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "кадры отправлены (попытка $i)"
              exit 0
            fi
            sleep 5
          done
          echo "не удалось отправить кадры"
          exit 1
