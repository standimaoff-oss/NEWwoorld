name: NeuroYadro verify

on:
  pull_request:
    paths:
      - "neuroyadro/**"
      - ".github/workflows/neuroyadro-verify.yml"
  push:
    branches: [main, "arena/**"]
    paths:
      - "neuroyadro/**"
      - ".github/workflows/neuroyadro-verify.yml"

permissions:
  contents: read

jobs:
  training-tests:
    name: Python pipeline tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: neuroyadro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neuroyadro/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run deterministic architecture and dataset tests
        run: python -m unittest discover -s tests -v

  linux-desktop-build:
    name: Linux Qt and llama.cpp build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 307e3f155ec2c3c6c0560c454ab46bb64baeb2df
          path: third_party/llama.cpp
          fetch-depth: 1
      - name: Configure desktop application
        run: >-
          cmake -S neuroyadro/app -B build/neuroyadro-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNEUROYADRO_LLAMA_CPP_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp"
          -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF
          -DGGML_LLAMAFILE=OFF
      - name: Build desktop application
        run: cmake --build build/neuroyadro-linux --parallel
