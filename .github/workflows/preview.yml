name: Preview

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Software render of the water mesher
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile core + renderer (no Minecraft needed)
        shell: bash
        run: |
          mkdir -p build/preview
          javac -encoding UTF-8 -d build/preview \
            $(find src/main/java/com/standimaoff/aquaflux/core -name '*.java') \
            tools/PreviewRenderer.java 2>&1 | tee preview-build.log

      - name: Report preview failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "Ветка: \`$GITHUB_REF_NAME\`, коммит \`${GITHUB_SHA:0:7}\`"
            echo "Запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            head -c 20000 preview-build.log 2>/dev/null || echo "нет лога"
            echo '```'
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Preview failure: ${GITHUB_REF_NAME}" --body-file issue.md

      - name: Render scenes
        run: java -cp build/preview PreviewRenderer docs/preview

      - name: Commit previews
        run: |
          git config user.name "aquaflux-ci"
          git config user.email "ci@aquaflux.invalid"
          git add -f docs/preview
          if git diff --cached --quiet; then
            echo "изображения не изменились"
          else
            git commit -m "docs: превью воды ${GITHUB_SHA::7} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload previews
        uses: actions/upload-artifact@v7
        with:
          name: water-preview
          path: docs/preview/*.png
          if-no-files-found: error
