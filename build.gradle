/*
 * Aquaflux - физическая вода для Forge 1.20.1.
 *
 * Сборка:   ./gradlew build      -> build/libs/aquaflux-<version>.jar
 * Тесты:    ./gradlew test       -> ядро (com.standimaoff.aquaflux.core) без игры
 * Клиент:   ./gradlew runClient  -> игровой профиль в run/
 *
 * Конфиг повторяет схему, проверенную в CI на ForgeGradle 6, mojang-маппингах,
 * Gradle 8.8 и JDK 17: `--add-opens` для runClient и reobfJar финализатором jar.
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'aquaflux.dev', 'true'
            // 1.20.1 + JDK 17: netty требует открытия внутренних пакетов java.base
            jvmArgs += ['--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED']
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // CI: скриншоты прямо из игры. Включается только с -Pshots=<папка>.
            if (project.hasProperty('shots')) {
                jvmArgs += ["-Daquaflux.screenshots=${project.property('shots')}"]
                args '--quickPlaySingleplayer', 'harness'
                args '--width', '1280', '--height', '720'
            }
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Тесты ядра: чистый JDK, игровые классы не нужны.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
    reports.junitXml.required = true
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy 'reobfJar'
