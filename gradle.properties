# ---- Aquaflux ---------------------------------------------------------------------------
# Forge 1.20.1, официальные (mojang) маппинги, JDK 17, Gradle 8.8.
# Версии Forge можно поднимать внутри 47.x: код использует только API, стабильный на 1.20.1.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.parallel=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.7
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings
mapping_channel=official
mapping_version=1.20.1

# Mod metadata
mod_id=aquaflux
mod_name=Aquaflux
mod_version=0.2.0
mod_group_id=com.standimaoff.aquaflux
mod_authors=standimaoff
mod_license=MIT
mod_description=Fizicheskaya voda: konechnaya massa, techenie, volny, 16/32/64-bit preset. Physical finite-volume water for Forge 1.20.1.
