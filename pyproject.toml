[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "newwoorld-ai"
version = "1.0.0"
description = "NEWwoorld AI Studio: Part-by-Part Image Synthesis, Neuro-Symbolic CAD 3D Geometry, Vision/OCR & Billion-Scale PyTorch Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "trimesh>=4.0.0",
    "safetensors>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["newwoorld_ai*"]
